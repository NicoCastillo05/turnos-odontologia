spring:
  application:
    name: turnos-odontologia
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/turnosdb}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-not-for-production}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  whatsapp:
    token: ${WHATSAPP_TOKEN:}
    phone-id: ${WHATSAPP_PHONE_ID:}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    user: ${SMTP_USER:}
    pass: ${SMTP_PASS:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
